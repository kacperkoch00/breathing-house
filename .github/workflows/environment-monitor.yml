name: environment-monitor CI

on:
  push:
    branches: [main]
    paths:
      - 'svc/environment-monitor/**'
      - 'deploy/helm/environment-monitor/**'
      - 'Makefile'
      - '.github/workflows/environment-monitor.yml'
  pull_request:
    paths:
      - 'svc/environment-monitor/**'
      - 'deploy/helm/environment-monitor/**'
      - 'Makefile'
      - '.github/workflows/environment-monitor.yml'

permissions:
  contents: read

jobs:
  build-test-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svc/environment-monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: svc/environment-monitor/go.mod
          cache-dependency-path: svc/environment-monitor/go.sum
      - uses: azure/setup-helm@v5
      - name: Generate OpenAPI code
        run: make generate
      - name: Test
        run: go test ./...
      - name: Build binary
        run: go build -o /tmp/environment-monitor ./cmd/server
      - name: Integration smoke test
        run: |
          HTTP_PORT=18080 /tmp/environment-monitor >/tmp/environment-monitor.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/live && break
            sleep 1
          done
          curl --fail http://127.0.0.1:18080/ready
      - name: Helm lint
        working-directory: .
        run: helm lint deploy/helm/environment-monitor
      - name: Build image
        working-directory: .
        run: docker build -t environment-monitor:ci svc/environment-monitor

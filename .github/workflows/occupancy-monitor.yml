name: occupancy-monitor CI

on:
  push:
    branches: [main]
    paths:
      - 'svc/occupancy-monitor/**'
      - 'deploy/helm/occupancy-monitor/**'
      - 'Makefile'
      - '.github/workflows/occupancy-monitor.yml'
      - '.github/workflows/kubernetes-integration.yml'
  pull_request:
    paths:
      - 'svc/occupancy-monitor/**'
      - 'deploy/helm/occupancy-monitor/**'
      - 'Makefile'
      - '.github/workflows/occupancy-monitor.yml'
      - '.github/workflows/kubernetes-integration.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-test-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svc/occupancy-monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: svc/occupancy-monitor/go.mod
          cache-dependency-path: svc/occupancy-monitor/go.sum
      - uses: azure/setup-helm@v5
      - name: Generate OpenAPI code
        run: make generate
      - name: Test
        run: go test ./...
      - name: Build binary
        run: go build -o /tmp/occupancy-monitor ./cmd/server
      - name: Integration smoke test
        run: |
          HTTP_PORT=18081 /tmp/occupancy-monitor >/tmp/occupancy-monitor.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18081/live && break
            sleep 1
          done
          curl --fail http://127.0.0.1:18081/ready
      - name: Helm lint
        working-directory: .
        run: helm lint deploy/helm/occupancy-monitor
      - name: Package Helm chart
        working-directory: .
        run: mkdir -p /tmp/helm && helm package deploy/helm/occupancy-monitor --destination /tmp/helm --version 0.1.0-ci.${{ github.run_number }} --app-version ${{ github.sha }}
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in Helm to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish Helm chart
        if: github.event_name == 'push'
        run: helm push /tmp/helm/occupancy-monitor-0.1.0-ci.${{ github.run_number }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Set image metadata
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/occupancy-monitor
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: svc/occupancy-monitor
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}

  kubernetes-integration:
    needs: build-test-integration
    if: needs.build-test-integration.result == 'success'
    uses: ./.github/workflows/kubernetes-integration.yml
    with:
      service: occupancy-monitor
      path: /live
      publish-oci: ${{ github.event_name == 'push' }}
    secrets: inherit

name: home-api CI

on:
  push:
    branches: [main]
    paths:
      - 'svc/home-api/**'
      - 'deploy/helm/home-api/**'
      - 'deploy/k8s/postgres-init.sql'
      - 'Makefile'
      - '.github/workflows/home-api.yml'
      - '.github/workflows/kubernetes-integration.yml'
  pull_request:
    paths:
      - 'svc/home-api/**'
      - 'deploy/helm/home-api/**'
      - 'deploy/k8s/postgres-init.sql'
      - 'Makefile'
      - '.github/workflows/home-api.yml'
      - '.github/workflows/kubernetes-integration.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: breathing_house
          POSTGRES_USER: bh
          POSTGRES_PASSWORD: bh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bh -d breathing_house"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: azure/setup-helm@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test and package
        working-directory: svc/home-api
        run: mvn -B test package
      - name: Start Kafka
        run: |
          docker run -d \
            --name kafka \
            -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:4.1.0

          for attempt in $(seq 1 30); do
            if docker exec kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --list >/dev/null 2>&1; then
              echo "Kafka is ready"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs kafka
              exit 1
            fi
            sleep 2
          done
      - name: Create Kafka status-data topic
        run: |
          docker exec kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic status-data
      - name: Initialize schema and load fixtures
        env:
          PGPASSWORD: bh
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U bh -d breathing_house; do sleep 1; done
          psql -h 127.0.0.1 -U bh -d breathing_house -v ON_ERROR_STOP=1 -f deploy/k8s/postgres-init.sql
          psql -h 127.0.0.1 -U bh -d breathing_house -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO environment.environment_reading (
            room_id, device_id, sensor_type, temperature, humidity, co2, light, light_level,
            observed_at, received_at, ingested_at, kafka_topic, kafka_partition, kafka_offset
          ) VALUES
            ('living-room', 'air-1', 'AIR', NULL, NULL, 700.0, NULL, NULL,
             '2026-10-03T10:00:00Z', '2026-10-03T10:00:01Z', '2026-10-03T10:00:02Z',
             'sensor-data', 0, 1),
            ('living-room', 'room-1', 'ROOM', 22.5, 45.0, NULL, NULL, NULL,
             '2026-10-03T09:00:00Z', '2026-10-03T09:00:01Z', '2026-10-03T09:00:02Z',
             'sensor-data', 0, 2),
            ('bedroom', 'room-2', 'ROOM', 21.0, 40.0, NULL, 10.0, 'DIM',
             '2026-10-03T08:00:00Z', '2026-10-03T08:00:01Z', '2026-10-03T08:00:02Z',
             'sensor-data', 0, 3);

          INSERT INTO occupancy.occupancy_event (
            room_id, device_id, event_type, present, open,
            observed_at, received_at, ingested_at, kafka_topic, kafka_partition, kafka_offset
          ) VALUES
            ('living-room', 'presence-1', 'PRESENCE', false, NULL,
             '2026-10-03T10:30:00Z', '2026-10-03T10:30:01Z', '2026-10-03T10:30:02Z',
             'event-data', 0, 1),
            ('kitchen', 'door-1', 'OPENING', NULL, true,
             '2026-10-03T09:30:00Z', '2026-10-03T09:30:01Z', '2026-10-03T09:30:02Z',
             'event-data', 0, 2),
            ('living-room', 'presence-1', 'PRESENCE', true, NULL,
             '2026-10-03T08:30:00Z', '2026-10-03T08:30:01Z', '2026-10-03T08:30:02Z',
             'event-data', 0, 3);
          SQL
      - name: Integration smoke test
        working-directory: svc/home-api
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/breathing_house
          DATABASE_USERNAME: bh
          DATABASE_PASSWORD: bh
          PGPASSWORD: bh
          ALERT_CONFIG_PATH: /tmp/home-api-alerts.json
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          KAFKA_STATUS_TOPIC: status-data
          KAFKA_STATUS_CONSUMER_GROUP_ID: home-api-gateway-status-ci
          SENSOR_GATEWAY_ID: gateway
          SENSOR_GATEWAY_HEARTBEAT_TIMEOUT: 5s
          KAFKA_RETRY_DELAY: 1s
        run: |
          set -euo pipefail
          cat >/tmp/home-api-alerts.json <<'JSON'
          {
            "evaluationInterval": "1s",
            "alerts": [{
              "id": "ci-poor-air-and-warm",
              "type": "COMPOSITE",
              "combinator": "ALL",
              "for": "0s",
              "severity": "WARNING",
              "rooms": ["living-room"],
              "message": "CI composite in {{roomId}}: {{values}}",
              "conditions": [
                {
                  "id": "co2",
                  "type": "THRESHOLD",
                  "source": "ENVIRONMENT",
                  "sensorType": "AIR",
                  "metric": "CO2",
                  "operator": "GREATER_THAN",
                  "threshold": 600,
                  "maxDataAge": "36500d"
                },
                {
                  "id": "temperature",
                  "type": "THRESHOLD",
                  "source": "ENVIRONMENT",
                  "sensorType": "ROOM",
                  "metric": "TEMPERATURE",
                  "operator": "GREATER_THAN",
                  "threshold": 20,
                  "maxDataAge": "36500d"
                }
              ]
            }]
          }
          JSON

          java -jar target/home-api-0.1.0-SNAPSHOT.jar --server.port=18082 >/tmp/home-api.log 2>&1 &
          pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo '---- home-api log ----'
              cat /tmp/home-api.log || true
              echo '---- postgres log ----'
              docker logs "${{ job.services.postgres.id }}" 2>/dev/null || true
              echo '---- kafka log ----'
              docker logs kafka 2>/dev/null || true
            fi
            kill "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18082/live && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18082/ready

          rooms="$(curl --fail --silent http://127.0.0.1:18082/api/v1/rooms)"
          echo "$rooms" | jq -e '
            ([.rooms[].roomId] | sort) == ["bedroom","kitchen","living-room"] and
            all(.rooms[]; .displayName == .roomId)
          '

          rename="$(curl --fail --silent -X PATCH \
            http://127.0.0.1:18082/api/v1/rooms/living-room \
            -H 'Content-Type: application/json' \
            -d '{"displayName":"Living Room"}')"
          echo "$rename" | jq -e '
            .roomId == "living-room" and .displayName == "Living Room"
          '

          curl --fail --silent -X PATCH \
            http://127.0.0.1:18082/api/v1/rooms/living-room \
            -H 'Content-Type: application/json' \
            -d '{"displayName":"Living Room"}' >/dev/null

          rooms="$(curl --fail --silent http://127.0.0.1:18082/api/v1/rooms)"
          echo "$rooms" | jq -e '
            (.rooms | map(select(.roomId == "living-room")) | .[0].displayName) == "Living Room" and
            (.rooms | map(select(.roomId == "bedroom")) | .[0].displayName) == "bedroom"
          '

          psql -h 127.0.0.1 -U bh -d breathing_house -Atc \
            "SELECT count(*) FROM home_api.room_metadata" \
            | grep -q '^1$'

          env_page="$(curl --fail --silent \
            'http://127.0.0.1:18082/api/v1/rooms/living-room/environment-readings?limit=1&sensorType=AIR')"
          echo "$env_page" | jq -e '
            .limit == 1 and
            .offset == 0 and
            .hasMore == false and
            .items[0].roomId == "living-room" and
            .items[0].sensorType == "AIR" and
            .items[0].co2 == 700.0 and
            .items[0].temperature == null and
            .items[0].light == null
          '

          occ_page="$(curl --fail --silent \
            'http://127.0.0.1:18082/api/v1/rooms/living-room/occupancy-events?limit=1')"
          echo "$occ_page" | jq -e '
            .hasMore == true and
            (.items | length) == 1 and
            .items[0].roomId == "living-room" and
            .items[0].eventType == "PRESENCE" and
            .items[0].present == false and
            .items[0].open == null and
            .items[0].observedAt == "2026-10-03T10:30:00Z"
          '

          for attempt in $(seq 1 30); do
            active_alerts="$(psql -h 127.0.0.1 -U bh -d breathing_house -Atc \
              "SELECT count(*) FROM home_api.alert WHERE rule_id = 'ci-poor-air-and-warm' AND status = 'ACTIVE'")"
            if test "$active_alerts" = "1"; then
              break
            fi
            if test "$attempt" -eq 30; then
              echo "expected active CI composite alert was not created"
              exit 1
            fi
            sleep 1
          done

          psql -h 127.0.0.1 -U bh -d breathing_house -Atc \
            "SELECT device_id IS NULL FROM home_api.alert WHERE rule_id = 'ci-poor-air-and-warm' AND status = 'ACTIVE'" \
            | grep -q 't'

          psql -h 127.0.0.1 -U bh -d breathing_house -Atc \
            "SELECT message FROM home_api.alert WHERE rule_id = 'ci-poor-air-and-warm' AND status = 'ACTIVE'" \
            | grep -q 'CI composite in living-room: {"co2":"700","temperature":"22.5"}'

          psql -h 127.0.0.1 -U bh -d breathing_house -Atc \
            "SELECT trigger_value FROM home_api.alert WHERE rule_id = 'ci-poor-air-and-warm' AND status = 'ACTIVE'" \
            | grep -q '{"co2":"700","temperature":"22.5"}'

          gateway_status="$(curl --fail --silent http://127.0.0.1:18082/api/v1/sensor-gateway/status)"
          echo "$gateway_status" | jq -e '.online == false'

          observed_at="$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)"
          received_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat <<EOF | docker exec -i kafka /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server localhost:9092 \
            --topic status-data
          {"schemaVersion":1,"roomId":"gateway","deviceId":null,"type":"STATUS","observedAt":"${observed_at}","receivedAt":"${received_at}","values":{"status":"ONLINE","uptime":3600,"connected":true,"ci":true}}
          EOF

          for attempt in $(seq 1 30); do
            gateway_status="$(curl --fail --silent http://127.0.0.1:18082/api/v1/sensor-gateway/status)"
            if echo "$gateway_status" | jq -e '.online == true' >/dev/null; then
              break
            fi
            if test "$attempt" -eq 30; then
              echo "gateway status did not become online after STATUS publish"
              echo "$gateway_status"
              exit 1
            fi
            sleep 1
          done

          psql -h 127.0.0.1 -U bh -d breathing_house -Atc \
            "SELECT count(*) FROM home_api.gateway_heartbeat WHERE gateway_id = 'gateway'" \
            | grep -q '1'

          psql -h 127.0.0.1 -U bh -d breathing_house -v ON_ERROR_STOP=1 -Atc \
            "SELECT kafka_topic || '|' || kafka_partition || '|' || reported_status || '|' || (payload->>'ci')
             FROM home_api.gateway_heartbeat
             WHERE gateway_id = 'gateway'
             ORDER BY id DESC
             LIMIT 1" \
            | grep -q '^status-data|0|ONLINE|true$'

          sleep 6

          gateway_status="$(curl --fail --silent http://127.0.0.1:18082/api/v1/sensor-gateway/status)"
          echo "$gateway_status" | jq -e '.online == false'
      - name: Helm lint
        run: helm lint deploy/helm/home-api
      - name: Package Helm chart
        run: mkdir -p /tmp/helm && helm package deploy/helm/home-api --destination /tmp/helm --version 0.1.0-ci.${{ github.run_number }} --app-version ${{ github.sha }}
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in Helm to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish Helm chart
        if: github.event_name == 'push'
        run: helm push /tmp/helm/home-api-0.1.0-ci.${{ github.run_number }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Set image metadata
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/home-api
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: svc/home-api
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}

  kubernetes-integration:
    needs: build-test-integration
    if: needs.build-test-integration.result == 'success'
    uses: ./.github/workflows/kubernetes-integration.yml
    with:
      service: home-api
      path: /live
      readiness-path: /ready
      publish-oci: ${{ github.event_name == 'push' }}
    secrets: inherit

name: Night regression

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  KIND_CLUSTER: breathing-house

jobs:
  robot-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare result directory
        run: mkdir -p robot-results

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Create Kind configuration with Ingress and MQTT ports
        run: |
          cat > /tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
                - containerPort: 443
                  hostPort: 443
                  protocol: TCP
                - containerPort: 1883
                  hostPort: 1883
                  protocol: TCP
          EOF

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          config: /tmp/kind-config.yaml

      - name: Install NGINX Ingress controller
        run: kubectl apply -f https://githubusercontent.com

      - name: Wait for NGINX Ingress controller
        run: |
          kubectl rollout status deployment/ingress-nginx-controller \
            --namespace ingress-nginx \
            --timeout=180s

      - name: Install Mosquitto MQTT 5 Broker
        run: |
          helm repo add hookdoo https://github.io
          helm repo update
          helm upgrade --install mosquitto hookdoo/mosquitto \
            --set service.main.type=NodePort \
            --set service.main.ports.mqtt.nodePort=31883 \
            --set service.main.ports.mqtt.port=1883 \
            --set persistence.enabled=false \
            --set config.builtin="listener 1883"$'\n'"allow_anonymous true"
            
          kubectl rollout status deployment/mosquitto --timeout=120s

      - name: Build service images
        run: |
          for service in environment-monitor occupancy-monitor alert-notifier sensors-data-collector home-dashboard; do
            docker build -t "$service:nightly" "svc/$service"
          done

      - name: Load service images into Kind
        run: |
          for service in environment-monitor occupancy-monitor alert-notifier sensors-data-collector home-dashboard; do
            kind load docker-image "$service:nightly" --name "$KIND_CLUSTER"
          done

      - name: Install all service charts with Broker Routing Overrides
        run: |
          for service in environment-monitor occupancy-monitor alert-notifier sensors-data-collector home-dashboard; do
            helm upgrade --install "$service" "deploy/helm/$service" \
              --set image.repository="$service" \
              --set image.tag=nightly \
              --set image.pullPolicy=Never \
              --set ingress.enabled=true \
              --set ingress.hosts[0].host="$service.local" \
              --set ingress.hosts[0].paths[0].path=/ \
              --set ingress.hosts[0].paths[0].pathType=Prefix \
              --set env.MQTT_BROKER_IP="mosquitto" \
              --set env.MQTT_BROKER_PORT="1883"
          done

      - name: Wait for all service rollouts
        run: |
          for service in environment-monitor occupancy-monitor alert-notifier sensors-data-collector home-dashboard; do
            deployment=$(kubectl get deployment -l "app.kubernetes.io/name=$service" -o jsonpath='{.items[0].metadata.name}')
            kubectl rollout status "deployment/$deployment" --timeout=180s
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Robot Framework dependencies
        run: python -m pip install --requirement tests/robot/requirements.txt

      - name: Run Robot regression tests
        run: robot --outputdir robot-results tests/robot

      - name: Collect Kubernetes diagnostics
        if: always()
        run: |
          mkdir -p robot-results/kubernetes
          kubectl get pods,deployments,services,ingresses -A -o wide > robot-results/kubernetes/resources.txt
          kubectl get events -A --sort-by=.lastTimestamp > robot-results/kubernetes/events.txt
          kubectl logs deployment/mosquitto > robot-results/kubernetes/mosquitto.log 2>&1 || true
          
          for service in environment-monitor occupancy-monitor alert-notifier sensors-data-collector home-dashboard; do
            kubectl logs -l "app.kubernetes.io/name=$service" --all-containers=true --tail=200 \
              > "robot-results/kubernetes/$service.log" 2>&1 || true
          done

      - name: Upload Robot and Kubernetes results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: night-regression-results-${{ github.run_number }}
          path: robot-results
          if-no-files-found: error
          retention-days: 30

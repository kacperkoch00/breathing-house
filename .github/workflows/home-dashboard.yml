name: home-dashboard CI

on:
  push:
    branches: [main]
    paths:
      - 'svc/home-dashboard/**'
      - 'deploy/helm/home-dashboard/**'
      - 'Makefile'
      - '.github/workflows/home-dashboard.yml'
      - '.github/workflows/kubernetes-integration.yml'
  pull_request:
    paths:
      - 'svc/home-dashboard/**'
      - 'deploy/helm/home-dashboard/**'
      - 'Makefile'
      - '.github/workflows/home-dashboard.yml'
      - '.github/workflows/kubernetes-integration.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: svc/home-dashboard/package.json
      - uses: azure/setup-helm@v5
      - name: Install dependencies and build
        working-directory: svc/home-dashboard
        run: npm install && npm run build
      - name: Integration smoke test
        working-directory: svc/home-dashboard
        run: |
          npm run dev -- --host 127.0.0.1 --port 14173 >/tmp/home-dashboard.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:14173/ && exit 0
            sleep 1
          done
          exit 1
      - name: Helm lint
        run: helm lint deploy/helm/home-dashboard
      - name: Package Helm chart
        run: mkdir -p /tmp/helm && helm package deploy/helm/home-dashboard --destination /tmp/helm --version 0.1.0-ci.${{ github.run_number }} --app-version ${{ github.sha }}
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in Helm to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish Helm chart
        if: github.event_name == 'push'
        run: helm push /tmp/helm/home-dashboard-0.1.0-ci.${{ github.run_number }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Set image metadata
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/home-dashboard
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: svc/home-dashboard
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}

  kubernetes-integration:
    needs: build-test-integration
    if: needs.build-test-integration.result == 'success'
    uses: ./.github/workflows/kubernetes-integration.yml
    with:
      service: home-dashboard
      path: /
      readiness-path: /
      publish-oci: ${{ github.event_name == 'push' }}
    secrets: inherit

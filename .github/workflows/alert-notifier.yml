name: alert-notifier CI

on:
  push:
    branches: [main]
    paths:
      - 'svc/alert-notifier/**'
      - 'deploy/helm/alert-notifier/**'
      - 'Makefile'
      - '.github/workflows/alert-notifier.yml'
      - '.github/workflows/kubernetes-integration.yml'
  pull_request:
    paths:
      - 'svc/alert-notifier/**'
      - 'deploy/helm/alert-notifier/**'
      - 'Makefile'
      - '.github/workflows/alert-notifier.yml'
      - '.github/workflows/kubernetes-integration.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-test-integration:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - uses: azure/setup-helm@v5

      - name: Start Mosquitto
        run: |
          printf "listener 1883\nallow_anonymous true\n" > /tmp/mosquitto.conf
          docker run -d \
            --name mosquitto \
            -p 1883:1883 \
            -v /tmp/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro \
            eclipse-mosquitto:2.0.18 \
            mosquitto -c /mosquitto/config/mosquitto.conf

      - name: Test and package
        working-directory: svc/alert-notifier
        env:
          MQTT_BROKER_IP: 127.0.0.1
          MQTT_BROKER_PORT: 1883
        run: mvn -B verify

      - name: Helm lint
        run: helm lint deploy/helm/alert-notifier
      
      - name: Package Helm chart
        run: mkdir -p /tmp/helm && helm package deploy/helm/alert-notifier --destination /tmp/helm --version 0.1.0-ci.${{ github.run_number }} --app-version ${{ github.sha }}
      
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Log in Helm to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      
      - name: Publish Helm chart
        if: github.event_name == 'push'
        run: helm push /tmp/helm/alert-notifier-0.1.0-ci.${{ github.run_number }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      
      - name: Set image metadata
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alert-notifier
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: svc/alert-notifier
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}

  kubernetes-integration:
    needs: build-test-integration
    if: needs.build-test-integration.result == 'success'
    uses: ./.github/workflows/kubernetes-integration.yml
    with:
      service: alert-notifier
      path: /live
      readiness-path: /ready
      publish-oci: ${{ github.event_name == 'push' }}
    secrets: inherit
name: Kubernetes integration

on:
  workflow_call:
    inputs:
      service:
        description: Service directory and chart name
        required: true
        type: string
      path:
        description: HTTP path to verify through Ingress
        required: true
        type: string
      readiness-path:
        description: Readiness path to verify through Ingress
        required: true
        type: string
      publish-oci:
        description: Whether to install the published OCI chart and image
        required: true
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  ingress-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Create Kind configuration with Ingress ports
        run: |
          cat > /tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
                - containerPort: 443
                  hostPort: 443
                  protocol: TCP
          EOF

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: breathing-house
          config: /tmp/kind-config.yaml

      - name: Install NGINX Ingress controller
        run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

      - name: Wait for NGINX Ingress controller and admission webhook
        run: |
          kubectl rollout status deployment/ingress-nginx-controller \
            --namespace ingress-nginx \
            --timeout=180s
          for attempt in $(seq 1 60); do
            if kubectl get endpoints ingress-nginx-controller-admission \
              --namespace ingress-nginx \
              -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null | grep -q .; then
              break
            fi
            sleep 3
          done
          kubectl get endpoints ingress-nginx-controller-admission \
            --namespace ingress-nginx

          kubectl run ingress-webhook-check \
            --namespace ingress-nginx \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --command -- sleep 180
          trap 'kubectl delete pod ingress-webhook-check --namespace ingress-nginx --ignore-not-found' EXIT
          kubectl wait --namespace ingress-nginx \
            --for=jsonpath='{.status.phase}'=Running \
            pod/ingress-webhook-check \
            --timeout=60s

          for attempt in $(seq 1 60); do
            response_code=$(kubectl exec --namespace ingress-nginx ingress-webhook-check -- \
              curl --insecure --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 2 \
              https://ingress-nginx-controller-admission.ingress-nginx.svc:443/networking/v1/ingresses || true)
            if test -n "$response_code" && test "$response_code" != "000"; then
              echo "Admission webhook responded with HTTP $response_code"
              break
            fi
            sleep 3
          done

          test -n "$response_code" && test "$response_code" != "000"

      - name: Build service image for pull request
        if: ${{ !inputs.publish-oci }}
        run: docker build -t ${{ inputs.service }}:ci svc/${{ inputs.service }}

      - name: Load service image into Kind for pull request
        if: ${{ !inputs.publish-oci }}
        run: kind load docker-image ${{ inputs.service }}:ci --name breathing-house

      - name: Log in Helm to GitHub Container Registry
        if: inputs.publish-oci
        run: echo "${{ github.token }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Create GHCR pull secret for published image
        if: inputs.publish-oci
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ github.token }}" \
            --docker-email="${{ github.actor }}@users.noreply.github.com"

      - name: Install published OCI chart with Ingress
        if: inputs.publish-oci
        run: |
          helm upgrade --install ${{ inputs.service }} \
            oci://ghcr.io/${{ github.repository_owner }}/charts/${{ inputs.service }} \
            --version 0.1.0-ci.${{ github.run_number }} \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/${{ inputs.service }} \
            --set image.tag=sha-${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent \
            --set imagePullSecrets[0].name=ghcr-pull-secret \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=${{ inputs.service }}.local \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix

      - name: Install local chart with Ingress for pull request
        if: ${{ !inputs.publish-oci }}
        run: |
          helm upgrade --install ${{ inputs.service }} deploy/helm/${{ inputs.service }} \
            --set image.repository=${{ inputs.service }} \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=${{ inputs.service }}.local \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix

      - name: Wait for service rollout
        run: |
          deployment=$(kubectl get deployment -l app.kubernetes.io/name=${{ inputs.service }} -o jsonpath='{.items[0].metadata.name}')
          if ! kubectl rollout status "deployment/$deployment" --timeout=180s; then
            kubectl describe "deployment/$deployment"
            kubectl get pods -l app.kubernetes.io/name=${{ inputs.service }} -o wide
            kubectl describe pods -l app.kubernetes.io/name=${{ inputs.service }}
            kubectl logs -l app.kubernetes.io/name=${{ inputs.service }} --all-containers=true --tail=100 || true
            kubectl get events --sort-by=.lastTimestamp
            exit 1
          fi

      - name: Check service through Ingress
        run: |
          check_path() {
            curl --fail --silent --show-error \
              -H 'Host: ${{ inputs.service }}.local' \
              "http://127.0.0.1$1" >/tmp/ingress-response
          }

          successful_checks=0
          for attempt in $(seq 1 30); do
            if check_path '${{ inputs.path }}' && check_path '${{ inputs.readiness-path }}'; then
              successful_checks=$((successful_checks + 1))
              cat /tmp/ingress-response
              if test "$successful_checks" -ge 2; then
                exit 0
              fi
            else
              successful_checks=0
            fi
            sleep 2
          done
          kubectl get nodes -o wide
          kubectl get pods,ingress,svc -A
          exit 1

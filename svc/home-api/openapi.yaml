openapi: 3.0.3
info:
  title: Home API
  version: 1.0.0
  description: >
    Frontend-facing Breathing House API for room history and alerts.
    This revision establishes service identity only; currently only health
    and metrics endpoints are implemented.

paths:
  /live:
    get:
      operationId: getLive
      summary: Check whether the service is alive
      responses:
        '200':
          description: The service is alive
          content:
            text/plain:
              schema:
                type: string
                example: OK
  /ready:
    get:
      operationId: getReady
      summary: Check whether the service is ready
      responses:
        '200':
          description: The service is ready
          content:
            text/plain:
              schema:
                type: string
                example: READY

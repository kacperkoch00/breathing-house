spring.datasource.url=jdbc:h2:mem:homeapi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.flyway.enabled=false

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true

home-api.database.query-timeout-seconds=2
home-api.cors.allowed-origins=http://home-dashboard.local,http://localhost:5173
home-api.alerts.scheduling-enabled=false
home-api.kafka.status-topic=status-data
home-api.kafka.status-consumer-group-id=home-api-gateway-status
home-api.kafka.retry-delay=5ms
home-api.sensor-gateway.id=gateway
home-api.sensor-gateway.heartbeat-timeout=30s
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=home-api-gateway-status
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

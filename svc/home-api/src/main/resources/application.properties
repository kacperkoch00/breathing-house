spring.application.name=home-api
server.port=${HTTP_PORT:8082}

# Actuator / Prometheus (custom /live and /ready unchanged)
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true

# PostgreSQL (local defaults; production should use a read-only user + Secret)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/breathing_house}
spring.datasource.username=${DATABASE_USERNAME:bh}
spring.datasource.password=${DATABASE_PASSWORD:bh}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:2000}

home-api.database.query-timeout-seconds=${DATABASE_QUERY_TIMEOUT_SECONDS:2}
home-api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://home-dashboard.local,http://localhost:5173}

# Alert engine. Empty ALERT_CONFIG_PATH uses the packaged default configuration.
home-api.alerts.config-path=${ALERT_CONFIG_PATH:}
home-api.alerts.scheduling-enabled=${ALERT_SCHEDULING_ENABLED:true}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

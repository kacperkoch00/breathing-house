server.port=${HTTP_PORT:8083}

# Actuator / Prometheus (custom /live and /ready unchanged)
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true

# Structured console logging picked up by Alloy and shipped to Loki
logging.structured.format.console=ecs

# MQTT consumer configuration
mqtt.broker-ip=${MQTT_BROKER_IP:localhost}
mqtt.broker-port=${MQTT_BROKER_PORT_NUMBER:1883}
mqtt.client-id=${MQTT_CLIENT_ID:sensors-data-collector}
mqtt.consumer-topics=${MQTT_CONSUMER_TOPICS:home/sensors/room,home/sensors/air,home/sensors/opening,home/sensors/presence,home/gateway/status}
mqtt.initial-delay-ms=${MQTT_INITIAL_DELAY_MS:1000}
mqtt.max-delay-ms=${MQTT_MAX_DELAY_MS:60000}
mqtt.qos=${MQTT_QOS:1}

# Kafka producer configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.producer.topics.sensor=${KAFKA_SENSOR_TOPIC:sensor-data}
kafka.producer.topics.event=${KAFKA_EVENT_TOPIC:event-data}
kafka.producer.topics.status=${KAFKA_STATUS_TOPIC:status-data}
kafka.producer.topics.dlq=${KAFKA_DLQ_TOPIC:sensor-data-dlq}
# Local-dev Postgres for Minikube (not production).
# Defaults: user/password bh/bh, database breathing_house.
# In-cluster DNS: postgres:5432
# Init SQL runs only on first boot with an empty PVC.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
type: Opaque
stringData:
  POSTGRES_USER: bh
  POSTGRES_PASSWORD: bh
  POSTGRES_DB: breathing_house
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-init.sql: |
    -- Idempotent where practical; official image runs this only on empty data dir.
    CREATE SCHEMA IF NOT EXISTS environment;
    CREATE SCHEMA IF NOT EXISTS occupancy;

    CREATE TABLE IF NOT EXISTS environment.environment_reading (
      id BIGSERIAL PRIMARY KEY,
      room_id TEXT NOT NULL,
      device_id TEXT,
      sensor_type TEXT NOT NULL CHECK (sensor_type IN ('ROOM', 'AIR')),
      temperature DOUBLE PRECISION,
      humidity DOUBLE PRECISION,
      co2 DOUBLE PRECISION,
      light DOUBLE PRECISION,
      light_level TEXT,
      observed_at TIMESTAMPTZ NOT NULL,
      received_at TIMESTAMPTZ NOT NULL,
      ingested_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      kafka_topic TEXT,
      kafka_partition INT,
      kafka_offset BIGINT,
      UNIQUE (kafka_topic, kafka_partition, kafka_offset)
    );

    CREATE INDEX IF NOT EXISTS environment_reading_room_observed_at_idx
      ON environment.environment_reading (room_id, observed_at DESC);
    CREATE INDEX IF NOT EXISTS environment_reading_sensor_observed_at_idx
      ON environment.environment_reading (sensor_type, observed_at DESC);

    CREATE TABLE IF NOT EXISTS occupancy.occupancy_event (
      id BIGSERIAL PRIMARY KEY,
      room_id TEXT NOT NULL,
      device_id TEXT,
      event_type TEXT NOT NULL CHECK (event_type IN ('PRESENCE', 'OPENING')),
      present BOOLEAN,
      open BOOLEAN,
      observed_at TIMESTAMPTZ NOT NULL,
      received_at TIMESTAMPTZ NOT NULL,
      ingested_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      kafka_topic TEXT,
      kafka_partition INT,
      kafka_offset BIGINT,
      UNIQUE (kafka_topic, kafka_partition, kafka_offset)
    );

    CREATE INDEX IF NOT EXISTS occupancy_event_room_observed_at_idx
      ON occupancy.occupancy_event (room_id, observed_at DESC);
    CREATE INDEX IF NOT EXISTS occupancy_event_type_observed_at_idx
      ON occupancy.occupancy_event (event_type, observed_at DESC);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bh", "-d", "breathing_house"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

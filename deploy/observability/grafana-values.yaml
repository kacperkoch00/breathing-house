adminUser: admin
adminPassword: admin
persistence:
  enabled: true
  size: 2Gi
service:
  type: ClusterIP
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local:80
        isDefault: true
        editable: false
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        editable: false
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: breathing-house
        orgId: 1
        folder: Breathing House
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/breathing-house
dashboardsConfigMaps:
  breathing-house: breathing-house-dashboards

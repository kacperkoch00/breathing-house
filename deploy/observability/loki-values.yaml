deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-09-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 30d
  compactor:
    retention_enabled: true
    working_directory: /var/loki/retention
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi
gateway:
  enabled: true
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
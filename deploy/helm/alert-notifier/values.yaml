replicaCount: 1

image:
  repository: alert-notifier
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8082

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: alert-notifier.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  HTTP_PORT: "8082"

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

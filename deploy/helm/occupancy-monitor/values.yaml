replicaCount: 1

image:
  repository: occupancy-monitor
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: occupancy-monitor.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  HTTP_PORT: "8081"
  SHUTDOWN_TIMEOUT: 10s
  LOG_LEVEL: info
  KAFKA_BROKERS: kafka:9092
  KAFKA_CONSUMER_TOPIC: event-data
  KAFKA_CONSUMER_GROUP_ID: occupancy-monitor
  KAFKA_RETRY_DELAY: 5s

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

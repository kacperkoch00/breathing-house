apiVersion: v1
kind: Service
metadata:
  name: {{ include "mqtt-broker.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "mqtt-broker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: breathing-house
    app.kubernetes.io/component: mqtt
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "mqtt-broker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mqtt
      port: {{ .Values.service.port }}
      targetPort: mqtt
      protocol: TCP
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mqtt-broker.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "mqtt-broker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: breathing-house
    app.kubernetes.io/component: mqtt
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous {{ .Values.mqtt.allowAnonymous }}
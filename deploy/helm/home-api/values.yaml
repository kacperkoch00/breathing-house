replicaCount: 1

image:
  repository: home-api
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8082

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: home-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  HTTP_PORT: "8082"
  # Local/dev JDBC defaults. Production should inject a read-only DB user via Secret.
  DATABASE_URL: jdbc:postgresql://postgres:5432/breathing_house
  DATABASE_USERNAME: bh
  DATABASE_PASSWORD: bh
  DATABASE_CONNECTION_TIMEOUT_MS: "2000"
  DATABASE_QUERY_TIMEOUT_SECONDS: "2"
  CORS_ALLOWED_ORIGINS: "http://home-dashboard.local,http://localhost:5173"

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

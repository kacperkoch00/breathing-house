replicaCount: 1

image:
  repository: home-api
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8082

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: home-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  HTTP_PORT: "8082"
  # Local/dev JDBC defaults. Production should use a user that can read monitor
  # schemas and write only the home_api alert schema, injected via Secret.
  DATABASE_URL: jdbc:postgresql://postgres:5432/breathing_house
  DATABASE_USERNAME: bh
  DATABASE_PASSWORD: bh
  DATABASE_CONNECTION_TIMEOUT_MS: "2000"
  DATABASE_QUERY_TIMEOUT_SECONDS: "2"
  CORS_ALLOWED_ORIGINS: "http://home-dashboard.local,http://localhost:5173,http://localhost:8088"
  ALERT_SCHEDULING_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_STATUS_TOPIC: status-data
  KAFKA_STATUS_CONSUMER_GROUP_ID: home-api-gateway-status
  SENSOR_GATEWAY_ID: gateway
  SENSOR_GATEWAY_HEARTBEAT_TIMEOUT: 30s
  KAFKA_RETRY_DELAY: 5s

# Empty values use the default configuration packaged in the image. Supply JSON
# with `--set-file alerts.config=alerts.json`, or point at an existing ConfigMap.
alerts:
  config: ""
  existingConfigMap: ""

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
